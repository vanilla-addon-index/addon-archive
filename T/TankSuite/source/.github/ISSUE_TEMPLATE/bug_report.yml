name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: TankSuite version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Server / client
      description: Server name, SuperWoW version, nameplate addon (pfUI, ShaguPlates...)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error text, if any
      render: text
